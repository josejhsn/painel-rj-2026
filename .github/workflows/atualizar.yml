name: Atualizar dados de leiloes

on:
  schedule:
    - cron: "0 11,23 * * *"  # 08:00 e 20:00 no horario de Brasilia (UTC-3)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests tzdata

      - name: Rodar coletor
        run: python coletor.py

      - name: Publicar mudancas (se houver)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "Atualizacao automatica de dados"
          git push
